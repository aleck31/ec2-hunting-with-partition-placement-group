# Binance USDⓈ-M futures. From a VPC in ap-northeast-1 all three hosts resolve to EC2 addresses in Tokyo, apne1-az4
# (from outside AWS, fapi.binance.com can resolve to CloudFront instead). fstream fronts ~470 rotating IPs, so probes
# sample them; ws-fapi has 4.
name = "binance-usdm"

# Weights of the roles in the combined score for one host doing order entry and market data; e.g. a taker may weigh
# order entry higher, a market maker market data. Override with `hunt.py compare --weights order=0.7,md=0.3`.
[weights]
order = 0.5
md = 0.5

# WebSocket API, the order gateway. Order methods need signed requests, so this measures a public method on it.
[[endpoints]]
name = "ws-api"
protocol = "ws"
role = "order"
url = "wss://ws-fapi.binance.com/ws-fapi/v1"
request = '{"id":"{id}","method":"depth","params":{"symbol":"BTCUSDT","limit":5}}'
id_field = "id"

# Market data push; "u" is the order book update ID, identical on every instance for the same update
[[endpoints]]
name = "market-stream"
protocol = "stream"
role = "md"
url = "wss://fstream.binance.com/ws/btcusdt@bookTicker"
key_field = "u"
event_time_field = "E"

# REST API; server time is the lightest request (weight 1). fapi.binance.com is a CNAME to an ALB, which terminates
# TCP: probes of it only reach the ALB nodes, while the http round trip covers the path through the ALB.
[[endpoints]]
name = "rest"
protocol = "http"
role = "order"
url = "https://fapi.binance.com/fapi/v1/time"

# Plain TCP endpoints (e.g. a FIX gateway) are probed for handshake RTT only:
# [[endpoints]]
# name = "fix"
# protocol = "tcp"
# host = "fix.example-exchange.com"
# port = 9000
