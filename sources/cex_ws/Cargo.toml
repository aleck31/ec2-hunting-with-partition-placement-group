[package]
name = "cex_ws"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-native-roots"] }
url = "2.5"
futures-util = "0.3"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
serde_json = "1.0.145"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"